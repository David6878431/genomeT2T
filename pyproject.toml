[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genomet2t"
version = "0.1.0"
description = "Configurable Docker and Bash workflows for genome assembly and annotation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
genomet2t = "genomet2t.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
